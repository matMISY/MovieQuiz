name: movie_quiz
description: A movie quiz game where players guess actors who appeared in multiple films
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # HTTP requests
  http: ^1.1.0

  # Image caching
  cached_network_image: ^3.3.0

  # Environment variables
  flutter_dotenv: ^5.1.0

  # String similarity
  string_similarity: ^2.0.0

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
